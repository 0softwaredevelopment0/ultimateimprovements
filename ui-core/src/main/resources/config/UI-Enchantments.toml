# UltimateImprovments — UI-Enchantments configuration.
# The 18 custom enchantments (ui:*) registered through Paper's registry API
# (RegistryEvents.ENCHANTMENT) by UI-Datapack's bootstrap phase.
#
# Because they are real registry entries, everything here is baked into the
# registry once per server start: changing any value requires a restart. The
# tooltip is sent by the server, not by a resource pack, so the display name is
# server-wide and follows datapack.lang / messages.lang — pick name_ru or name_en
# accordingly (both are stored, the active language is applied at registration).
#
# Per enchantment: "enabled" switches the registry entry AND the plugin module
# implementing its effect. An existing item or book that carries a disabled
# enchantment keeps the data but the effect stops working.
#
# Not configurable here: the items an enchantment can be applied to. Three of them
# need tag unions (blunting, self_destruct, vulnerability) that the registry API
# cannot express from a plain config string, so the sets stay in
# EnchantmentDefinition (ui-datapack).

# Master switch for every custom enchantment.
# false = nothing is registered and no effect module is loaded.
# Requires a restart.
# Default: true
[enchantments]
enabled = true

# Values shared by all custom enchantments.
[enchantments.defaults]
# Rarity weight used by the enchanting table (lower = more common).
# Default: 1
weight = 1
# Enchanting-table cost curve: cost = base + per_level_above_first × (level - 1).
# Default: 25
min_cost_base = 25
# Default: 25
min_cost_per_level = 25
# Default: 75
max_cost_base = 75
# Default: 50
max_cost_per_level = 50

# ── Charms ──────────────────────────────────────────────────────────────────

# AoE — breaks the blocks around the mined one.
[enchantments.aoe]
# Default: true
enabled = true
# Default: "AoE"
name_en = "AoE"
# Default: "Область"
name_ru = "Область"
# Maximum level (10 = level I..X).
# Default: 10
max_level = 10
# Anvil cost per level.
# Default: 1
anvil_cost = 1
# Equipment slots that activate the effect: ANY, MAINHAND, OFFHAND, HAND, FEET,
# LEGS, CHEST, HEAD, ARMOR, BODY, SADDLE.
# Default: "MAINHAND"
active_slots = "MAINHAND"

