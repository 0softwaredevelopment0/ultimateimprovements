# UltimateImprovments — UI-Datapack configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# The bundled datapack language has its own switch: datapack.lang below.
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Bundled datapack: which custom content is enabled.
# The pack is built from the JAR as a single zip
# (plugins/UltimateImprovments/datapack/UI-Datapack-<lang>.zip) and registered by
# UI-Datapack's bootstrapper (Paper DATAPACK_DISCOVERY) BEFORE the worlds load and
# auto-enabled on every start, so installing/updating the plugin no longer needs a
# restart or /datapack enable. The zip is only rebuilt when its content changes
# (hash.txt next to it); changing these toggles still requires a server restart
# (discovery happens at startup only).
[datapack]
# Master switch (true = feature on).
# false = the pack is not registered at all (no recipes, structures, worldgen,
# advancements or item tags). Custom enchantments live in the registry and are
# controlled by configs/UI-Enchantments.toml, not by this key.
# Default: true
enabled = true

# Datapack language: "en" or "ru".
# Both variants carry identical content (advancements, recipes, structures,
# worldgen); only the display names/descriptions are translated.
# "auto" follows messages.lang from UI-Core.toml.
# Requires a server restart (the pack is registered once, at startup).
# Default: "auto"
lang = "auto"

# Where the pack goes in the datapack stack, relative to the world's own packs
# and other plugin-provided packs.
#   "top"    — this pack wins every conflicting file (default)
#   "bottom" — the world/datapack packs win conflicts instead
# Requires a server restart.
# Default: "top"
position = "top"

# Datapack parts. Each part covers the listed files inside the pack; a disabled
# part is not written into the built zip and its plugin code modules are not registered.
# Files that belong to no part are always written.
#
# Custom enchantments and achievements are NOT here: they have their own files,
# configs/UI-Enchantments.toml and configs/UI-Advancements.toml (master switch,
# one toggle per entry and the values that used to be constants in the code).
#
# Requires a server restart.
[datapack.modules]
# Custom recipes that add new items (ui/recipe/*).
# Default: true
custom_recipes = true
# Overrides of vanilla recipes (minecraft/recipe/*): chains, trident, netherite,
# uncrafting recipes, etc.
# Default: true
vanilla_recipes = true
# Overrides of vanilla loot tables (minecraft/loot_table/*).
# Default: true
loot_tables = true
# Custom structures AND the loot table that belongs to them
# (ui/structure/*, ui/loot_table/*, minecraft/structure/*), e.g. the airdrop chest,
# the enchanted room and the end village. Independent from "worldgen".
# Default: true
structures = true
# World generation: biomes, dimensions, noise settings, placed/configured features,
# structure sets and templates (minecraft/worldgen/*).
# Only affects NEWLY generated chunks; existing terrain is unchanged.
# Default: true
worldgen = true
# Dimension height/build-limit overrides (minecraft/dimension_type/*).
# Applies to every world using that dimension type, including existing ones.
# Default: true
dimension_limits = true
# Overrides of vanilla item tags (minecraft/tags/item/*, minecraft/tags/mineable/*),
# e.g. which blocks the vanilla tools can mine.
# Default: true
vanilla_tags = true
