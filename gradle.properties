# Do not pin a machine-specific JDK here: org.gradle.java.home breaks CI (Linux
# runners have no "C:/Program Files/..." path) and any other developer machine.
# Gradle uses JAVA_HOME, and the Java 26 toolchain is configured in the root
# build.gradle. For a personal override, put it in %USERPROFILE%\.gradle\gradle.properties
# (~/.gradle/gradle.properties on Linux) — that file is not committed.
