plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'UltimateImprovements'

// All plugin modules live under ui-src/ so the repository root stays tidy.
// The Gradle project names stay flat (`:ui-core`, `:ui-chat`, ...), so every
// `project(':ui-xxx')` dependency, jar name and task path is unchanged.
file('ui-src').eachDir { dir ->
    if (file("ui-src/${dir.name}/build.gradle").exists()) {
        include dir.name
        project(":${dir.name}").projectDir = dir
    }
}
