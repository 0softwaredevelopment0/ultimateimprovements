# Placeholders: %count%, %seconds%

[messages.bot_protection]
# Default: <red>❌ Сервер перегружен! Вы в очереди: позиция
queue_full = "<red>❌ Сервер перегружен! Вы в очереди: позиция"
# Default: <yellow>⚠</yellow> <red>Защита от ботов:</red> <yellow>%count%</yellow> <red>игроков пытались зайти за</red> <yellow>%seconds%s</yellow><red>. Включена очередь.</red>
