already_running = "<yellow>⚠</yellow> <white>A stress test is already running (</white><yellow>%type% / %power%</yellow><white>). Stop it first: </white><white>/ui stresstest stop</white>"
# The load generator refused to start.
start_failed = "<red>❌</red> <white>Could not start the stress test: </white><gray>%error%</gray>"
# Warmup started: %seconds% of baseline sampling.
warmup = "<yellow>⏳</yellow> <white>Stress test </white><yellow>%type% / %power%</yellow><gray>: measuring the baseline for </gray><yellow>%seconds%s</yellow><gray>…</gray>"
# Warmup over, load is being produced.
started = "<green>🔥</green> <white>Stress test </white><yellow>%type% / %power%</yellow> <green>is producing load</green><gray> — stop it with </gray><white>/ui stresstest stop</white>"
# /ui stresstest stop with no active run.
not_running = "<yellow>⚠</yellow> <white>No stress test is running.</white>"
# Alert to ui.alerts holders when a run starts: %player%, %type%, %power%.
alert_started = "<red>⚠</red> <white>Stress test </white><yellow>%type% / %power%</yellow> <white>started by </white><yellow>%player%</yellow>"
# First report line: %type%, %power%, %duration%, %reason%.
report_header = "<gray>══ Stress test: </gray><yellow>%type% / %power%</yellow><gray> — </gray><yellow>%duration%s</yellow><gray> (</gray>%reason%<gray>) ══</gray>"
# Second report line: %mspt_base%, %mspt_avg%, %mspt_max%, %tps_base%, %tps_avg%, %tps_min%.
report_stats = "<gray>MSPT:</gray> <white>%mspt_base%</white> <dark_gray>→</dark_gray> <yellow>%mspt_avg%</yellow><gray> avg / </gray><red>%mspt_max%</red><gray> max</gray>   <gray>TPS:</gray> <white>%tps_base%</white> <dark_gray>→</dark_gray> <yellow>%tps_avg%</yellow><gray> avg / </gray><red>%tps_min%</red><gray> min</gray>"
# Third report line: %ram_base%, %ram_avg%, %ram_max%, %entities%.
report_memory = "<gray>RAM:</gray> <white>%ram_base%</white> <dark_gray>→</dark_gray> <yellow>%ram_avg%</yellow><gray> avg / </gray><red>%ram_max%</red><gray> max</gray>   <gray>Entities:</gray> <white>%entities%</white>"
# Fourth report line: %work% (counter), %unit% (localised unit label).
report_work = "<gray>Work:</gray> <yellow>%work%</yellow> <white>%unit%</white>"

# Why a run ended (stresstest.reason.<id>).
[messages_en.stresstest.reason]
# /ui stresstest stop
manual = "<gray>stopped manually</gray>"
# stresstest.max_duration_seconds elapsed
duration = "<gray>time limit reached</gray>"
# Plugin/module disabled: shutdown or /ui reload
disable = "<gray>reload / shutdown</gray>"
# The load generator threw
error = "<gray>generator error</gray>"

# Unit labels for the report's work counter (stresstest.units.<type>).
[messages_en.stresstest.units]
# "entity" generator: spawned entities.
entity = "<white>entities spawned</white>"
# "block" generator: block updates applied.
block = "<white>block updates</white>"
# "chunk" generator: chunks whose state actually changed.
chunk = "<white>chunks loaded/unloaded</white>"
# "selector" generator: walks over the global entity list.
selector = "<white>entity list walks</white>"
