# UI-Guard — server guard (packet/proxy/redstone), bot protection, overload.
[packet_guard]
# Master switch (true = feature on).
# Default: true
enabled = true
# Permission node.
# Default: "ui.packetguard.bypass"
bypass_permission = "ui.packetguard.bypass"
# Maximum value.
# Default: 7000000
max_packet_size = 7000000
# Default: true
log = true
# Default: false
log_inject = false

# Proxy-related settings (forwarding, IP handling).

[proxy_server]
# Master switch (true = feature on).
# Default: true
enabled = true
# Command.
# Default: true
log_commands = true
# Message text (MiniMessage).
# Default: "<red>❌ You don't have permission to switch servers!</red>"
no_permission_message = "<red>❌ You don't have permission to switch servers!</red>"

# Redstone lag protection (limits per area/time).

[redstone_guard]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: 50.0
mspt_threshold = 50.0
# Limit.
# Default: 10
chunk_iterations_limit = 10

# Emergency cleanup of excessive entities.

[emergency_entity_kill]
# Master switch (true = feature on).
# Default: true
enabled = true
# Limit.
# Default: 1000
entity_limit = 1000
# Default: 50.0
mspt_threshold = 50.0
# World name.
# Default: []
kill_worlds = []
# Default: true
log = true
# Default: false
broadcast_to_all = false
# Cooldown.
# Default: 30000
notification_cooldown_ms = 30000

# Warns staff when the server is overloaded (TPS drop).

[server_overload_warning]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: 40.0
high_mspt = 40.0
# Default: 50.0
critical_mspt = 50.0
# Cooldown.
# Default: 30
notify_cooldown_seconds = 30

# Blocks bot-like joins/behaviour.

[bot_protection]
# Master switch (true = feature on).
# Default: true
enabled = true
# Cooldown.
# Default: 3
rejoin_cooldown_seconds = 3
# Duration.
# Default: 10
priority_session_duration = 10

# queue section.

[bot_protection.queue]
# Maximum value.
# Default: 2
max_joins_per_window = 2
# Default: 1
window_seconds = 1
# Default: true
notify_ops = true
# Maximum value.
# Default: 5
priority_max_joins_per_window = 5

# /ui changedimmension world switching: cooldowns and permissions.

[messages.packet_guard]
# Kick message shown when the outgoing packet exceeds the limit.
kick_message = "<dark_red>❌</dark_red> <red>Слишком большой пакет данных!</red>\n<gray>Пожалуйста, перезайдите на сервер.</gray>"

