# CHECK / CODEPANEL / SUDO / MAINTENANCE
# ==================================================================

# codepanel section.
[codepanel]
# Maximum value.
# Default: 10
max_length = 10
# Cooldown.
# Default: 3
enter_cooldown = 3

# sounds section.
[codepanel.sounds]
# Default: "UI_BUTTON_CLICK"
digit = "UI_BUTTON_CLICK"
# Default: "BLOCK_DISPENSER_FAIL"
backspace = "BLOCK_DISPENSER_FAIL"
# Default: "ENTITY_EXPERIENCE_ORB_PICKUP"
enter = "ENTITY_EXPERIENCE_ORB_PICKUP"
# Default: "ENTITY_PLAYER_LEVELUP"
success = "ENTITY_PLAYER_LEVELUP"
# Default: "BLOCK_ANVIL_LAND"
fail = "BLOCK_ANVIL_LAND"

# sudo section.
[sudo]
# Master switch (true = feature on).
# Default: true
enabled = true
# Minimum value.
# Default: 15
session_minutes = 15
# Cooldown.
# Default: 10
attempt_cooldown_seconds = 10
# Command.
# Vanilla "op" and "deop" are listed too: those commands stay usable but must
# pass sudo mode before the deprecation notice and the repeat-to-confirm step.
# Default: ["ui punish", "ui power", "ui sudo", "ui op", "ui deop", "ui opself", "ui whitelist", "ui opwhitelist", "ui opblacklist", "ui blacklist", "ui maintenance", "ui stresstest", "op", "deop", "stop", "restart", "lp", "luckperms"]
dangerous_commands = ["ui punish", "ui power", "ui sudo", "ui op", "ui deop", "ui opself", "ui whitelist", "ui opwhitelist", "ui opblacklist", "ui blacklist", "ui maintenance", "ui stresstest", "op", "deop", "stop", "restart", "lp", "luckperms"]

# Command policy: vanilla commands superseded by /ui equivalents.
# Typing them reports error 011 ("command disabled on this server").

[command_policy]
# Master switch for the policy: true = the commands listed in disabled_commands
# are rejected with error 011 ("This command is disabled on this server").
# Blocked for players AND the console/RCON alike. Off by default.
# Default: false
enabled = false
# Command prefixes disabled on this server (without the leading slash).
# Prefix matching: an entry "save" also blocks "save-all".
# Vanilla "op"/"deop"/"stop"/"restart" have dedicated deprecated-but-allowed
# flows and should not be listed here unless you really want error 011.
# Default: []
disabled_commands = []

# GSit /spin guard — protection against the GSit version-mismatch bug that
# leaves the player INVISIBLE for everyone else after using /spin.
# Opt-in: keep disabled unless the installed GSit build does not match the
# server/client version. Both /spin and its GSit alias /gspin are covered.

[gsit_spin_guard]
# Master switch (true = feature on).
# Default: false
enabled = false
# Protection mode:
#   1 — /spin requires the ui.gsit.spin permission; players without it get
#       error 002 (insufficient permissions);
#   2 — /spin is disabled on the server; players get error 011 (command
#       disabled on this server).
# Default: 1
mode = 1

[maintenance]
# Maintenance mode switch: non-staff players are kicked/blocked.
# Default: true
enabled = true

# /ui console lockdown — emergency console lockout (all console/RCON commands
# are cancelled while active). The lockdown state itself lives in the database
# and survives restarts.

[console_lockdown]
# KILL SWITCH: emergency escape hatch. Set to true if the lockdown locks you
# out — on the next server restart or /ui reload the saved lockdown state is
# wiped from the database, the lockdown is lifted and this option is
# automatically reset back to false.
# Default: false
kill_switch = false

# /ui server lockdown — emergency server lockout against join floods (bot
# attacks and similar). While active, NEW connections are refused, but players
# already online are NOT kicked: they may leave and rejoin within the grace
# window. The lockdown state itself lives in the database and survives
# restarts.

[server_lockdown]
# KILL SWITCH: emergency escape hatch. Set to true if the lockdown locks you
# out — on the next server restart or /ui reload the saved lockdown state
# (including grace marks) is wiped from the database, the lockdown is lifted
# and this option is automatically reset back to false.
# Default: false
kill_switch = false

# Grace window: a player who was on the server when the lockdown was enabled
# may leave and rejoin within this time after quitting without being blocked;
# after the window expires they are treated like every other new connection.
# Time format: <number>s|m|h|d (e.g. 10s, 5m, 2h, 1d).
# Default: 10s
grace_time = "10s"

# /ui stresstest — server benchmarks (/ui stresstest start <type> <power>).
# The generators create REAL load (entities, block updates, chunk IO), so the
# command additionally requires the ui.command.stresstest permission, which is
# deliberately NOT granted by default.

[stresstest]
# Master switch (true = /ui stresstest is available).
# Default: true
enabled = true
# Seconds of baseline sampling BEFORE the load starts; MSPT/TPS/RAM measured
# here become the "before" column of the report. 0 = no warmup, no baseline.
# Default: 3
warmup_seconds = 3
# Ticks between two load-generator work cycles. 1 = a cycle every tick (the
# heaviest option), 20 = one cycle per second.
# Default: 1
interval_ticks = 1
# Auto-stop the run after this many seconds — the safety net against a run
# that nobody stopped. 0 = unlimited (only /ui stresstest stop ends it).
# Default: 300
max_duration_seconds = 300
# Notify ui.alerts holders when a run starts.
# Default: true
alert_on_start = true
# Also write the benchmark report to the console (the initiator always gets it).
# Default: true
log_report = true
# EntityType used by the "entity" load generator (a Bukkit enum name).
# Default: "COW"
entity_type = "COW"
# Hard cap on simultaneously living spawned entities; once reached, the
# generator stops spawning and only the ticking load continues.
# Default: 2000
max_entities = 2000

