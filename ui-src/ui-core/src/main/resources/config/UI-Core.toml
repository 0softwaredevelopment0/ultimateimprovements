# Timed whitelist/blacklist operations: delayed add/remove/on/off (the -t flag)
# and the instant *-temp variants with an automatic revert. %list% is the
# localized list name. Time suffixes: s (seconds), m (minutes), h (hours), d (days).
# Placeholders: %player%, %duration%, %list%
[messages.punishment.timed]
# Player will be added after the delay.
# Default: ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>будет добавлен в</white> <yellow>%list%</yellow> <white>через</white> <yellow>%duration%</yellow>"]
add_scheduled = ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>будет добавлен в</white> <yellow>%list%</yellow> <white>через</white> <yellow>%duration%</yellow>"]
# Player will be removed after the delay.
# Default: ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>будет удалён из</white> <yellow>%list%</yellow> <white>через</white> <yellow>%duration%</yellow>"]
remove_scheduled = ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>будет удалён из</white> <yellow>%list%</yellow> <white>через</white> <yellow>%duration%</yellow>"]
# Player added instantly, removed automatically after the delay.
# Default: ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>добавлен в</white> <yellow>%list%</yellow> <white>на</white> <yellow>%duration%</yellow>"]
add_temp = ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>добавлен в</white> <yellow>%list%</yellow> <white>на</white> <yellow>%duration%</yellow>"]
# Player removed instantly, added back automatically after the delay.
# Default: ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>удалён из</white> <yellow>%list%</yellow> <white>на</white> <yellow>%duration%</yellow>"]
remove_temp = ["<green>✔</green> <white>Игрок</white> <yellow>%player%</yellow> <white>удалён из</white> <yellow>%list%</yellow> <white>на</white> <yellow>%duration%</yellow>"]
# List will be enabled after the delay.
# Default: ["<green>✔</green> <yellow>%list%</yellow> <white>будет включён через</white> <yellow>%duration%</yellow>"]
on_scheduled = ["<green>✔</green> <yellow>%list%</yellow> <white>будет включён через</white> <yellow>%duration%</yellow>"]
# List will be disabled after the delay.
# Default: ["<green>✔</green> <yellow>%list%</yellow> <white>будет выключен через</white> <yellow>%duration%</yellow>"]
off_scheduled = ["<green>✔</green> <yellow>%list%</yellow> <white>будет выключен через</white> <yellow>%duration%</yellow>"]
# List enabled instantly, disabled automatically after the delay.
# Default: ["<green>✔</green> <yellow>%list%</yellow> <white>включён на</white> <yellow>%duration%</yellow>"]
on_temp = ["<green>✔</green> <yellow>%list%</yellow> <white>включён на</white> <yellow>%duration%</yellow>"]
# List disabled instantly, enabled back automatically after the delay.
# Default: ["<green>✔</green> <yellow>%list%</yellow> <white>выключен на</white> <yellow>%duration%</yellow>"]
off_temp = ["<green>✔</green> <yellow>%list%</yellow> <white>выключен на</white> <yellow>%duration%</yellow>"]
# Player is already in the list.
# Default: ["<yellow>⚠</yellow> <white>Игрок</white> <yellow>%player%</yellow> <white>уже в</white> <yellow>%list%</yellow>"]
already_in_list = ["<yellow>⚠</yellow> <white>Игрок</white> <yellow>%player%</yellow> <white>уже в</white> <yellow>%list%</yellow>"]
# Player is not in the list.
# Default: ["<red>❌</red> <white>Игрок</white> <yellow>%player%</yellow> <white>не найден в</white> <yellow>%list%</yellow>"]
not_in_list = ["<red>❌</red> <white>Игрок</white> <yellow>%player%</yellow> <white>не найден в</white> <yellow>%list%</yellow>"]
# List is already enabled.
# Default: ["<yellow>⚠</yellow> <yellow>%list%</yellow> <white>уже включён.</white>"]
already_enabled = ["<yellow>⚠</yellow> <yellow>%list%</yellow> <white>уже включён.</white>"]
# List is already disabled.
# Default: ["<yellow>⚠</yellow> <yellow>%list%</yellow> <white>уже выключен.</white>"]
already_disabled = ["<yellow>⚠</yellow> <yellow>%list%</yellow> <white>уже выключен.</white>"]
# Invalid -t flag value.
# Default: ["<red>❌ Неверный формат времени!</red>", "<gray>Используйте: </gray><white>30s</white><gray>, </gray><white>5m</white><gray>, </gray><white>2h</white><gray>, </gray><white>1d</white>"]
invalid_time = ["<red>❌ Неверный формат времени!</red>", "<gray>Используйте: </gray><white>30s</white><gray>, </gray><white>5m</white><gray>, </gray><white>2h</white><gray>, </gray><white>1d</white>"]
# *-temp command called without the required -t flag.
# Default: ["<red>❌ Этой команде требуется флаг времени </red><white>-t</white><red>!</red>", "<gray>Укажите длительность: </gray><white>5m</white><gray>, </gray><white>2h</white><gray>, </gray><white>1d</gray>"]
temp_requires_time = ["<red>❌ Этой команде требуется флаг времени </red><white>-t</white><red>!</red>", "<gray>Укажите длительность: </gray><white>5m</white><gray>, </gray><white>2h</white><gray>, </gray><white>1d</gray>"]

# ==================================================================
# Console texts of the startup config validation (ConfigValidator).
# Placeholders: %key%, %message%, %type%, %value%, %min%, %max%, %description%,
# %length%, %regex%, %index%, %chars%, %error%, %errors%, %warnings%, %dir%
[messages.config_validation]
# Value is not a boolean.
# Default: Ожидался boolean (true/false), получен %type%: %value%
expected_boolean = "Ожидался boolean (true/false), получен %type%: %value%"
# Value is not an integer.
# Default: Ожидалось целое число, получен %type%: %value%
expected_int = "Ожидалось целое число, получен %type%: %value%"
# Value is not a decimal number.
# Default: Ожидалось число с плавающей точкой, получен %type%: %value%
expected_double = "Ожидалось число с плавающей точкой, получен %type%: %value%"
# Value is not a string.
# Default: Ожидалась строка, получен %type%: %value%
expected_string = "Ожидалась строка, получен %type%: %value%"
# Float given for an integer key — it will be rounded.
# Default: Значение с плавающей точкой, будет округлено до %value%
float_rounded = "Значение с плавающей точкой, будет округлено до %value%"
# Value does not fit into a 32-bit integer.
# Default: Значение вне диапазона int: %value%
int_out_of_range = "Значение вне диапазона int: %value%"
# Value equals infinity.
# Default: Значение равно бесконечности (Infinity)
infinite_value = "Значение равно бесконечности (Infinity)"
# Value is NaN.
# Default: Значение не является числом (NaN)
nan_value = "Значение не является числом (NaN)"
# Value outside the allowed range.
# Default: Значение %value% вне диапазона [%min%..%max%]%description%
out_of_range = "Значение %value% вне диапазона [%min%..%max%]%description%"
# Optional rule description appended by out_of_range.
# Default:  (%description%)
range_description = " (%description%)"
# Empty string where a value is required.
# Default: Строка пуста
empty_string = "Строка пуста"
# Whitespace-only string where a value is required.
# Default: Строка состоит только из пробелов
blank_string = "Строка состоит только из пробелов"
# String contains control characters.
# Default: Строка содержит управляющие символы: %chars%
control_chars = "Строка содержит управляющие символы: %chars%"
# String is longer than the allowed maximum.
# Default: Длина (%length%) превышает максимум (%max%)
string_too_long = "Длина (%length%) превышает максимум (%max%)"
# String does not match the required pattern.
# Default: Строка не соответствует формату: %regex%
regex_mismatch = "Строка не соответствует формату: %regex%"
# Value is not a list of strings.
# Default: Ожидался список строк, получен %type%
expected_string_list = "Ожидался список строк, получен %type%"
# A list item is not a string.
# Default: Элемент #%index% — ожидалась строка, получен %type%
list_item_not_string = "Элемент #%index% — ожидалась строка, получен %type%"
# A string list item contains control characters.
# Default: Элемент #%index% содержит управляющие символы: %chars%
list_item_control_chars = "Элемент #%index% содержит управляющие символы: %chars%"
# A regex list item does not compile.
# Default: Элемент #%index% — невалидный regex: %error%
invalid_regex = "Элемент #%index% — невалидный regex: %error%"
# Value is not a list of integers.
# Default: Ожидался список целых чисел, получен %type%
expected_int_list = "Ожидался список целых чисел, получен %type%"
# A list item is not an integer.
# Default: Элемент — ожидалось целое число, получен %type%
list_item_not_int = "Элемент — ожидалось целое число, получен %type%"
# Value is not a list of numbers.
# Default: Ожидался список чисел, получен %type%
expected_double_list = "Ожидался список чисел, получен %type%"
# A list item is not a number.
# Default: Элемент — ожидалось число, получен %type%
list_item_not_number = "Элемент — ожидалось число, получен %type%"
# One validation error line.
# Default: [ConfigValidator] ⚠ [ERROR] %key%: %message%
error_line = "[ConfigValidator] ⚠ [ERROR] %key%: %message%"
# One validation warning line.
# Default: [ConfigValidator] ⚠ [WARN] %key%: %message%
warn_line = "[ConfigValidator] ⚠ [WARN] %key%: %message%"
# Summary banner border line.
# Default: !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
summary_border = "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
# Summary banner title line.
# Default: !  ПРОВЕРКА ЗНАЧЕНИЙ КОНФИГА ЗАВЕРШЕНА                  !
