# Console texts of the startup config validation (ConfigValidator).
# Placeholders: %key%, %message%, %type%, %value%, %min%, %max%, %description%,
# %length%, %regex%, %index%, %chars%, %error%, %errors%, %warnings%, %dir%
[messages_en.config_validation]
# Value is not a boolean.
# Default: Expected boolean (true/false), got %type%: %value%
expected_boolean = "Expected boolean (true/false), got %type%: %value%"
# Value is not an integer.
# Default: Expected an integer, got %type%: %value%
expected_int = "Expected an integer, got %type%: %value%"
# Value is not a decimal number.
# Default: Expected a decimal number, got %type%: %value%
expected_double = "Expected a decimal number, got %type%: %value%"
# Value is not a string.
# Default: Expected a string, got %type%: %value%
expected_string = "Expected a string, got %type%: %value%"
# Float given for an integer key — it will be rounded.
# Default: Floating-point value, it will be rounded to %value%
float_rounded = "Floating-point value, it will be rounded to %value%"
# Value does not fit into a 32-bit integer.
# Default: Value is outside the int range: %value%
int_out_of_range = "Value is outside the int range: %value%"
# Value equals infinity.
# Default: The value is infinite (Infinity)
infinite_value = "The value is infinite (Infinity)"
# Value is NaN.
# Default: The value is not a number (NaN)
nan_value = "The value is not a number (NaN)"
# Value outside the allowed range.
# Default: Value %value% is outside the range [%min%..%max%]%description%
out_of_range = "Value %value% is outside the range [%min%..%max%]%description%"
# Optional rule description appended by out_of_range.
# Default:  (%description%)
range_description = " (%description%)"
# Empty string where a value is required.
# Default: The string is empty
empty_string = "The string is empty"
# Whitespace-only string where a value is required.
# Default: The string consists of whitespace only
blank_string = "The string consists of whitespace only"
# String contains control characters.
# Default: The string contains control characters: %chars%
control_chars = "The string contains control characters: %chars%"
# String is longer than the allowed maximum.
# Default: Length (%length%) exceeds the maximum (%max%)
string_too_long = "Length (%length%) exceeds the maximum (%max%)"
# String does not match the required pattern.
# Default: The string does not match the pattern: %regex%
regex_mismatch = "The string does not match the pattern: %regex%"
# Value is not a list of strings.
# Default: Expected a string list, got %type%
expected_string_list = "Expected a string list, got %type%"
# A list item is not a string.
# Default: Item #%index% — expected a string, got %type%
list_item_not_string = "Item #%index% — expected a string, got %type%"
# A string list item contains control characters.
# Default: Item #%index% contains control characters: %chars%
list_item_control_chars = "Item #%index% contains control characters: %chars%"
# A regex list item does not compile.
# Default: Item #%index% — invalid regex: %error%
invalid_regex = "Item #%index% — invalid regex: %error%"
# Value is not a list of integers.
# Default: Expected an integer list, got %type%
expected_int_list = "Expected an integer list, got %type%"
# A list item is not an integer.
# Default: Item — expected an integer, got %type%
list_item_not_int = "Item — expected an integer, got %type%"
# Value is not a list of numbers.
# Default: Expected a number list, got %type%
expected_double_list = "Expected a number list, got %type%"
# A list item is not a number.
# Default: Item — expected a number, got %type%
list_item_not_number = "Item — expected a number, got %type%"
# One validation error line.
# Default: [ConfigValidator] ⚠ [ERROR] %key%: %message%
error_line = "[ConfigValidator] ⚠ [ERROR] %key%: %message%"
# One validation warning line.
# Default: [ConfigValidator] ⚠ [WARN] %key%: %message%
warn_line = "[ConfigValidator] ⚠ [WARN] %key%: %message%"
# Summary banner border line.
# Default: !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
summary_border = "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
# Summary banner title line.
# Default: !  CONFIG VALUE VALIDATION COMPLETE                     !
summary_title = "!  CONFIG VALUE VALIDATION COMPLETE                     !"
# Summary banner error count line (shown only when errors > 0).
# Default: !  %errors% error(s) found - fix these values!          !
summary_errors = "!  %errors% error(s) found - fix these values!          !"
# Summary banner warning count line (shown only when warnings > 0).
# Default: !  %warnings% warning(s) found - review recommended.    !
summary_warnings = "!  %warnings% warning(s) found - review recommended.    !"
# Summary banner note line.
# Default: !  Plugin will use defaults for invalid values.         !
summary_note = "!  Plugin will use defaults for invalid values.         !"
# Shown when every value passed validation.
# Default: [ConfigValidator] ✓ All config values passed validation.
all_passed = "[ConfigValidator] ✓ All config values passed validation."
# Legacy monolithic config.toml found in the data folder.
# Default: [Config] Legacy monolithic config.toml found in %dir% — settings now live in configs/UI-<Addon>.toml
legacy_monolithic = "[Config] Legacy monolithic config.toml found in %dir% — settings now live in configs/UI-<Addon>.toml"
