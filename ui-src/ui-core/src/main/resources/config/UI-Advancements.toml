# "A netherite king" — hold a netherite block.
[advancements.a_netherite_king]
# Default: true
enabled = true

# ── Server emergencies ──────────────────────────────────────────────────────

# "Something's not right here..." — MSPT crosses the warning threshold
# (server_overload_warning in UI-Guard.toml drives the alerts themselves).
[advancements.server_overload]
# Default: true
enabled = true

# "Halt the plugin" — the plugin is shut down.
[advancements.halt_the_plugin]
# Default: true
enabled = true

# "java.lang.OutOfMemoryError" — the JVM heap is nearly exhausted.
[advancements.out_of_memory]
# Default: true
enabled = true
# Heap usage, percent, that counts as exhausted (the JVM dies before a literal 100).
# Default: 95.0
threshold_percent = 95.0

# "The server has not responding!" — the main thread froze for long enough.
[advancements.server_not_responding]
# Default: true
enabled = true
# Main-thread freeze required, seconds.
# Default: 10
freeze_seconds = 10

