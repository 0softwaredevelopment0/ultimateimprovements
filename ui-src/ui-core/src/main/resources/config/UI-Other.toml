# Default: "<gray>World Name</gray>"
world_label = "<gray>World Name</gray>"
# Default: "<green>✔ Teleport</green>"
tp_button = "<green>✔ Teleport</green>"
# Default: "<aqua>↩ Return back</aqua>"
return_button = "<aqua>↩ Return back</aqua>"
# Default: "<red>❌ Cancel</red>"
cancel_button = "<red>❌ Cancel</red>"

