# UltimateImprovements — UI-Other configuration.
# This single file holds the addon's settings AND its messages (RU + EN).
# Language: the global switch is messages.lang in UI-Core.toml ("en" or "ru").
# Every value can be edited; the file is re-read by /ui reload.
# Missing keys are auto-repaired from the bundled defaults on startup.

# ==================================================================
# SETTINGS
# ==================================================================


# Mechanics feature toggles and parameters (UI-Other umbrella).
[features]

# minecart speed section.
[features.minecart_speed]
# Master switch (true = feature on).
# Default: true
enabled = true
# Maximum value.
# Default: 8.0
base_max_speed = 8.0
# Limit.
# Default: 999999999
max_speed_limit = 999999999
# Default: 1.005
acceleration_factor = 1.005
# Default: 0.998
deceleration_factor = 0.998
# Default: 0.06
thrust_per_tick = 0.06
# Minimum value.
# Default: 15.0
collision_min_speed = 15.0
# Interval in ticks (20 ticks = 1 second).
# Default: 1
interval_ticks = 1

# hopper smelt section.
[features.minecart_speed.hopper_smelt]
# Master switch (true = feature on).
# Default: true
enabled = true
# Minimum value.
# Default: 50.0
min_speed = 50.0

# integrity section.
[features.integrity]
# Master switch (true = feature on).
# Default: true
enabled = true

# on break section.
[features.integrity.on_break]
# Sound name (minecraft:...).
# Default: true
play_sound = true
# Sound name (minecraft:...).
# Default: 2.0
sound_volume = 2.0
# Sound name (minecraft:...).
# Default: 1.0
sound_pitch = 1.0

# low integrity warning section.
[features.integrity.low_integrity_warning]
# Default: [75, 50, 25, 10, 5]
thresholds = [75, 50, 25, 10, 5]

# unbreaking section.
[features.integrity.unbreaking]
# Master switch (true = feature on). When on, plugin wear (custom enchantments,
# piercing, sunburn) rolls the vanilla Unbreaking chance per damage point:
# tools 1/(level+1), armor 0.6+0.4/(level+1).
# Default: true
enabled = true

# piercing section.
[features.integrity.piercing]
# Master switch (true = feature on).
# Default: true
enabled = true
# Cost.
# Default: 0.5
extra_integrity_cost = 0.5

# creative item validator section.
[features.creative_item_validator]
# Master switch (true = feature on).
# Default: true
enabled = true
# Permission node.
# Default: "ui.creative.bypass"
bypass_permission = "ui.creative.bypass"
# Maximum value.
# Default: 10240
max_item_bytes = 10240
# Maximum value.
# Default: 30
max_pdc_keys = 30
# Maximum value.
# Default: 50
max_lore_lines = 50
# Maximum value.
# Default: 1000
max_lore_chars = 1000
# Maximum value.
# Default: 200
max_name_chars = 200
# Maximum value.
# Default: 40
max_enchantments = 40

# shulker protection section.
[features.shulker_protection]
# Master switch (true = feature on).
# Default: true
enabled = true

# leash section.
[features.leash]
# Master switch (true = feature on).
# Default: true
enabled = true
# Distance in blocks.
# Default: 10
max_distance = 10
# Interval in ticks (20 ticks = 1 second).
# Default: 40
pull_back_interval = 40
# Default: true
prevent_break = true
# Default: true
hard_stop = true

# container trigger section.
[features.container_trigger]
# Master switch (true = feature on).
# Default: false
enabled = false
# Interval in ticks (20 ticks = 1 second).
# Default: 1
interval_ticks = 1
# Default: []
triggers = []

# waypoint section.
# Removed: the Waypoint module was an empty stub (a timer that did nothing).
# Client-side waypoint ranges live in features.attributes.units (UI-Player.toml).

# mobfinder section.
[features.mobfinder]
# How many hostile mobs in the scanned chunk turn the Mob Finder report red.
# Default: 8
danger_threshold = 8

# Death logger: records player deaths and optionally mirrors them to the console.
[death_logger]
# Master switch (true = feature on).
# Default: false
enabled = false
# Default: true
log_to_console = true

# Dimension change command (/ui changedimmension) and its dialog.
[changedimmension]
# World name.
# Default: "pocketworld"
default_world = "pocketworld"
# Cooldown.
# Default: 10
cooldown_seconds = 10

# dialog section.
[changedimmension.dialog]
# Title text (MiniMessage).
# Default: "<gold>✦ Change Dimension</gold>"
title = "<gold>✦ Change Dimension</gold>"
# Default: "<white>Where do you want to teleport?</white>"
body = "<white>Where do you want to teleport?</white>"
