helmet_durability_loss = 1
# Blacklist of transparent blocks that do NOT shelter from the sun. The
# plugin scans the block column above the player's head itself: air, liquids
# and passable blocks are skipped, listed blocks are ignored (sunlight passes
# through them), and the first remaining solid block counts as shade. No such
# block up to the world top means direct sunlight: the player burns without a
# helmet and wears the helmet with one. Glass and other light-passing blocks
# are listed by default.
# Default: all glass blocks/panes, ice, slime, honey, copper grates,
# iron bars and beacon
block_blacklist = [
    "glass", "tinted_glass", "glass_pane",
    "white_stained_glass", "white_stained_glass_pane",
    "orange_stained_glass", "orange_stained_glass_pane",
    "magenta_stained_glass", "magenta_stained_glass_pane",
    "light_blue_stained_glass", "light_blue_stained_glass_pane",
    "yellow_stained_glass", "yellow_stained_glass_pane",
    "lime_stained_glass", "lime_stained_glass_pane",
    "pink_stained_glass", "pink_stained_glass_pane",
    "gray_stained_glass", "gray_stained_glass_pane",
    "light_gray_stained_glass", "light_gray_stained_glass_pane",
    "cyan_stained_glass", "cyan_stained_glass_pane",
    "purple_stained_glass", "purple_stained_glass_pane",
    "blue_stained_glass", "blue_stained_glass_pane",
    "brown_stained_glass", "brown_stained_glass_pane",
    "green_stained_glass", "green_stained_glass_pane",
    "red_stained_glass", "red_stained_glass_pane",
    "black_stained_glass", "black_stained_glass_pane",
    "ice", "packed_ice", "blue_ice", "frosted_ice",
    "slime_block", "honey_block",
    "copper_grate", "exposed_copper_grate", "weathered_copper_grate",
    "oxidized_copper_grate", "waxed_copper_grate", "waxed_exposed_copper_grate",
    "waxed_weathered_copper_grate", "waxed_oxidized_copper_grate",
    "iron_bars", "beacon",
]
# Skip non-solid blocks while scanning upward: when true (default) only a
# solid block counts as a roof, so torches, plants and other passable blocks
# are ignored. Set to false to let any non-air block above the head shelter
# the player. The blacklist above is applied after this check.
# Default: true
skip_non_solid_blocks = true
# World name.
# Default: ["world"]
included_worlds = ["world"]

# /kill-style suicide command behaviour.
[suicide]
# Duration.
# Default: 10
countdown_duration = 10
# Cooldown.
# Default: 10
cooldown_seconds = 10
# Timeout.
# Default: 30
confirm_timeout = 30

# sounds section.
[suicide.sounds]
# Default: "BLOCK_NOTE_BLOCK_PLING"
warning = "BLOCK_NOTE_BLOCK_PLING"
# Default: "BLOCK_NOTE_BLOCK_PLING"
tick = "BLOCK_NOTE_BLOCK_PLING"
# Default: "ENTITY_LIGHTNING_BOLT_THUNDER"
finish = "ENTITY_LIGHTNING_BOLT_THUNDER"

# bossbar section.
[suicide.bossbar]
# Color.
# Default: "RED"
color = "RED"
# Default: "SOLID"
style = "SOLID"

# Elytra wear: during ACTUAL gliding the elytra can tear and drop to a few
# durability points. Rolled once per interval, only while gliding with a
# glider item equipped in the chest slot.
[elytra_wear]
# Master switch (true = feature on).
# Default: true
enabled = true
# Chance in percent per roll. The roll happens once per interval_ticks.
# Default: 0.1
chance_percent = 0.1
# Durability left after a tear: the tooltip shows X/N with X = this value,
# independent of N (vanilla elytra → 2/432).
# Default: 2
min_durability = 2
# Roll interval in ticks. 80 ticks = 4 seconds → one roll per 4 seconds.
# Default: 80
interval_ticks = 80
# Skip CREATIVE/SPECTATOR players.
# Default: true
ignore_creative = true

# suicide section.
# Placeholders: %seconds%, %timeout%
[messages.suicide]

# messages section.
