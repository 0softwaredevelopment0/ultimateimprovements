# attributes section.
[features.attributes]
# Master switch (true = feature on).
# Default: true
enabled = true

# Attribute units. Each unit changes ONE attribute of its targets, either with a
# persistent MODIFIER (default) or by overriding the BASE value.
# Unit names are ordinal numbers (1, 2, 3, ...).
#
# ⚠ TO REMOVE THE MODIFIERS left on players: set enabled = false ABOVE WITHOUT
# deleting the units below, then run `/ui reload` or restart the server. The
# plugin strips every modifier described here from all online players (and from
# each player on his next join) and records the new state in the database
# (ui_state, namespace "attributes"). A modifier's identity is its unit name
# (key unit_<name>), so DELETING or RENAMING a unit while it is applied leaves
# its old modifier on the players forever.
[features.attributes.units]

# Unit 1 — how far this player receives other players' waypoints.
[features.attributes.units."1"]
# Change type: "modifier" (persistent modifier, default) or "base" (replaces
# the vanilla base value; then use `value` instead of `target`).
# Default: modifier
type = "modifier"
# Attribute key: namespaced (minecraft:...), bare (waypoint_receive_range) or
# legacy constant (WAYPOINT_RECEIVE_RANGE).
# Default: minecraft:waypoint_receive_range
attribute = "minecraft:waypoint_receive_range"
# Desired FINAL value (modifier type only): the plugin computes the modifier
# amount itself as `target - current base value`, so a server-side default or a
# value changed by another plugin cannot skew the result. Measured on the server
# (Leaf 26.3 registry): waypoint_receive/transmit_range default 0 with a
# 60 000 000 maximum, below_name_distance 10, name_tag_distance 64,
# sneaking_speed 0.3 (capped at 1.0), attack_speed 4, attack_damage 2 (players
# get their own base from DefaultAttributes). The attribute's own min/max limit
# still applies. Use `amount` instead for a raw addition ("amount = 2.0" = +2
# on top of the base).
# Default: 8192.0
target = 8192.0
# Modifier operation: add_number | add_scalar | multiply_scalar_1 (modifier only).
# Default: add_number
operation = "add_number"
# Equipment slot group the modifier applies to (modifier only).
# Default: any
slot = "any"
# Re-apply on a schedule: false = apply once at startup/join, true = every
# `interval_ticks`. Modifiers persist in player data, so false is enough for
# them; base values are overwritten by vanilla/other plugins more often.
# Default: false
schedule = false
# Period of the re-application, in ticks (20 ticks = 1 second).
# Default: 200
interval_ticks = 200
# Targets: ["all"] for every online player, or a list of nicknames.
# Default: ["all"]
targets = ["all"]

# Unit 2 — how far this player's waypoints are sent to other players.
[features.attributes.units."2"]
# Default: modifier
type = "modifier"
# Default: minecraft:waypoint_transmit_range
attribute = "minecraft:waypoint_transmit_range"
# Default: 8192.0
target = 8192.0
# Default: add_number
operation = "add_number"
# Default: any
slot = "any"
# Default: false
schedule = false
# Default: 200
interval_ticks = 200
# Default: ["all"]
targets = ["all"]

# Unit 3 — distance at which this player's name is rendered below the entity.
[features.attributes.units."3"]
# Default: modifier
type = "modifier"
# Default: minecraft:below_name_distance
attribute = "minecraft:below_name_distance"
# Default: 8.0
target = 8.0
# Default: add_number
operation = "add_number"
# Default: any
slot = "any"
# Default: false
schedule = false
# Default: 200
interval_ticks = 200
# Default: ["all"]
targets = ["all"]

# Unit 4 — distance at which this player's name tag is visible.
[features.attributes.units."4"]
